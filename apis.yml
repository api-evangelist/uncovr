name: Uncovr
description: Uncovr is a surgical AI company building a foundation model for surgery.
  Its platform captures video from any operating-room source (laparoscopic, robotic,
  or other devices), analyzes procedures in real time, and automatically generates
  operative reports, CPT billing codes, and structured clinical intelligence, with
  a zero-PHI on-device anonymization architecture and EHR integration. Uncovr publishes
  no developer portal or SDKs, but serves a live OpenAPI 3.1 inference API (with
  Swagger UI) at api.uncovr.ai, and publishes an llms.txt on its website.
